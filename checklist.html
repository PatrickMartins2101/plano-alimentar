<!-- Cole este bloco dentro do <body> do index.html -->
<section class="meal" id="checklist-section">
  <div class="meal-head">
    <h2>☑️ Checklist diário</h2>
    <div class="time">Hoje</div>
  </div>
  <div class="checklist">
    <label class="check-item"><input type="checkbox" id="check-agua"><span>💧 Bebi a quantidade de água planejada</span></label>
    <label class="check-item"><input type="checkbox" id="check-refeicoes"><span>🍽️ Cumpri minhas refeições do dia</span></label>
    <label class="check-item"><input type="checkbox" id="check-exercicio"><span>🏃 Realizei minha atividade física</span></label>
    <label class="check-item"><input type="checkbox" id="check-sono"><span>😴 Mantive uma boa rotina de sono</span></label>
    <label class="check-item"><input type="checkbox" id="check-plano"><span>🥗 Segui o plano alimentar</span></label>
  </div>
  <div class="check-progress">
    <strong id="check-progress-text">0 de 5 concluídos</strong>
    <div class="progress-bar"><div id="check-progress-fill"></div></div>
  </div>
</section>
